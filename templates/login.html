<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kayan Admin - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "secondary-container": "#dfe0e0",
                        "surface-tint": "#0061a5",
                        "on-tertiary-fixed-variant": "#633f00",
                        "tertiary-container": "#de9200",
                        "surface-container-lowest": "#ffffff",
                        "background": "#f7f9fc",
                        "on-secondary-fixed": "#1a1c1c",
                        "on-tertiary-container": "#503200",
                        "secondary": "#5d5f5f",
                        "secondary-fixed": "#e2e2e2",
                        "on-surface-variant": "#404752",
                        "inverse-on-surface": "#eff1f4",
                        "tertiary-fixed-dim": "#ffb956",
                        "surface-container": "#eceef1",
                        "primary-container": "#4da6ff",
                        "primary-fixed-dim": "#a0caff",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e6e8eb",
                        "on-tertiary-fixed": "#2a1800",
                        "surface-dim": "#d8dadd",
                        "surface-container-highest": "#e0e3e6",
                        "inverse-primary": "#a0caff",
                        "tertiary-fixed": "#ffddb5",
                        "on-tertiary": "#ffffff",
                        "primary": "#0061a5",
                        "inverse-surface": "#2d3133",
                        "outline": "#707783",
                        "outline-variant": "#c0c7d4",
                        "error": "#ba1a1a",
                        "tertiary": "#835400",
                        "secondary-fixed-dim": "#c6c6c7",
                        "surface-bright": "#f7f9fc",
                        "surface-variant": "#e0e3e6",
                        "on-primary-fixed": "#001c37",
                        "on-background": "#191c1e",
                        "on-primary-fixed-variant": "#00497e",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f2f4f7",
                        "primary-fixed": "#d2e4ff",
                        "on-secondary-container": "#616363",
                        "on-primary-container": "#003a67",
                        "on-secondary": "#ffffff",
                        "surface": "#f7f9fc",
                        "on-secondary-fixed-variant": "#454747",
                        "error-container": "#ffdad6",
                        "on-surface": "#191c1e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans", "IBM Plex Sans Arabic"],
                        "body": ["Inter", "IBM Plex Sans Arabic"],
                        "label": ["Inter", "IBM Plex Sans Arabic"]
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', 'IBM Plex Sans Arabic', sans-serif;
            background-color: #f7f9fc;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 97, 165, 0.08);
        }
        .primary-gradient {
            background: linear-gradient(135deg, #0061a5 0%, #4da6ff 100%);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface min-h-screen flex items-center justify-center p-4">
<!-- Login Container -->
<main class="w-full max-w-[480px]">
<div class="glass-card rounded-xl p-10 border border-white/20">
<!-- Logo & Header -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-primary-fixed mb-6">
<span class="text-3xl font-black text-primary font-headline tracking-tighter">alKyan</span>
</div>
<h1 class="text-2xl font-bold text-on-surface font-headline mb-2">مرحباً بك في الكيان</h1>
<p class="text-on-surface-variant text-sm">قم بتسجيل الدخول للوصول إلى لوحة الإدارة</p>
</div>

<!-- Login Form -->
<form class="space-y-6" id="loginForm" method="POST" action="{% url 'web_login' %}">
    {% csrf_token %} <div class="space-y-2">
        <label class="block text-sm font-semibold text-on-surface-variant mr-1" for="phone">رقم الهاتف</label>
        <div class="relative">
            <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">call</span>
            <input class="w-full pr-12 pl-4 py-3.5 bg-surface-container-lowest border-none rounded-xl text-on-surface focus:ring-2 focus:ring-primary-container transition-all" 
                   id="phone" name="phone" placeholder="05xxxxxxxx" required type="tel"/>
        </div>
    </div>

    <div class="space-y-2">
        <label class="block text-sm font-semibold text-on-surface-variant mr-1" for="password">كلمة المرور</label>
        <div class="relative">
            <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
            <input class="w-full pr-12 pl-4 py-3.5 bg-surface-container-lowest border-none rounded-xl text-on-surface focus:ring-2 focus:ring-primary-container transition-all" 
                   id="password" name="password" placeholder="••••••••" required type="password"/>
        </div>
    </div>

    <button class="w-full primary-gradient text-on-primary font-bold py-4 rounded-xl shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" 
            id="submitBtn" type="submit">
        <span id="btnText">تسجيل الدخول</span>
    </button>
</form>

<!-- Footer -->
<div class="mt-12 text-center">
<p class="text-sm text-on-surface-variant">
                    ليس لديك حساب؟ 
                    <a class="text-primary font-bold mr-1" href="#">تواصل مع الإدارة</a>
</p>
</div>
</div>
<!-- System Branding Decoration -->
<div class="mt-8 flex justify-center gap-8 opacity-40 grayscale pointer-events-none">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
<span class="text-xs font-medium">نظام محمي</span>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">shield</span>
<span class="text-xs font-medium">تشفير SSL</span>
</div>
</div>
</main>
<!-- Toast Notification (Success/Error) -->
<div class="fixed bottom-8 right-8 translate-y-20 opacity-0 transition-all duration-300 z-50" id="toast">
<div class="flex items-center gap-3 px-6 py-4 rounded-xl shadow-2xl min-w-[320px]" id="toastContent">
<span class="material-symbols-outlined" id="toastIcon"></span>
<p class="text-sm font-bold" id="toastMessage"></p>
</div>
</div>
<script>
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const toast = document.getElementById('toast');
        const toastContent = document.getElementById('toastContent');
        const toastIcon = document.getElementById('toastIcon');
        const toastMessage = document.getElementById('toastMessage');

        function showToast(message, type = 'error') {
            toastMessage.textContent = message;
            
            if (type === 'error') {
                toastContent.className = 'flex items-center gap-3 px-6 py-4 rounded-xl shadow-2xl min-w-[320px] bg-error-container text-on-error-container';
                toastIcon.textContent = 'error';
            } else {
                toastContent.className = 'flex items-center gap-3 px-6 py-4 rounded-xl shadow-2xl min-w-[320px] bg-secondary-container text-on-secondary-container';
                toastIcon.textContent = 'check_circle';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 4000);
        }


        document.addEventListener('DOMContentLoaded', function() {
        {% if messages %}
            {% for message in messages %}
                showToast("{{ message }}", "{{ message.tags }}");
            {% endfor %}
        {% endif %}
    });

    // دالة الـ Toast التي تملكها (بقيت كما هي مع تعديل بسيط للـ type)
    function showToast(message, type = 'error') {
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const toastContent = document.getElementById('toastContent');
        const toastIcon = document.getElementById('toastIcon');

        toastMessage.textContent = message;
        
        if (type === 'error' || type === 'danger') {
            toastContent.className = 'flex items-center gap-3 px-6 py-4 rounded-xl shadow-2xl min-w-[320px] bg-error-container text-on-error-container';
            toastIcon.textContent = 'error';
        } else {
            toastContent.className = 'flex items-center gap-3 px-6 py-4 rounded-xl shadow-2xl min-w-[320px] bg-secondary-container text-on-secondary-container';
            toastIcon.textContent = 'check_circle';
        }

        toast.classList.remove('translate-y-20', 'opacity-0');
        setTimeout(() => {
            toast.classList.add('translate-y-20', 'opacity-0');
        }, 4000);
    }





    </script>
</body></html>
